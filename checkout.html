<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>
</head>
<body>

    <h1>Checkout</h1>

    <button onclick="checkout()">Checkout</button>

    <p id="message"></p>

    <script>
        function checkout() {
            document.getElementById("message").innerText =
                "Order placed successfully!";
        }
    </script>

</body>
</html>
